# Runs the basket every 4 hours. If this file lives in a subdirectory of your
# repo, move it to <repo>/.github/workflows/ and keep the working-directory
# setting below pointed at the scraper.
name: scrape-airfares

on:
  # DISABLED — Cleartrip answers GitHub's runners with HTTP 403 (even
  # for /robots.txt); OTAs block datacenter IP ranges. Verified in CI
  # run 33526308194 on 2026-09-01. Re-enable only with a self-hosted
  # runner on a residential connection, or a residential proxy:
  #   runs-on: [self-hosted, linux]
  # schedule:
  # # Once daily at 02:00 UTC (07:30 IST). A full-basket run is ~45 minutes,
  # # and a private repo gets 2,000 Actions minutes a month — 4-hourly would
  # # burn that in a week. Make the repo public (unlimited minutes) if you
  # # want the original */4 cadence back.
  # - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Override LLM_MODEL for this run"
        required: false
        default: ""

concurrency:
  group: scrape-airfares
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: airfare-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LLM_MODEL: ${{ github.event.inputs.model || vars.LLM_MODEL || 'z-ai/glm-5.2' }}
        run: python main.py | tee run.jsonl

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: airfare-scraper/run.jsonl
          retention-days: 14
